[workspace]
default-members = ["crates/fmgrep"]
members = ["crates/docfm", "crates/docfm-bits", "crates/fmgrep", "crates/bench", "crates/msbwt"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/pepeiborra/fmgrep"
authors = ["Pepe Iborra"]

# docfm's tests build large indexes; unoptimized they take minutes.
[profile.dev.package.docfm]
opt-level = 3

[profile.dev.package.docfm-bits]
opt-level = 3
