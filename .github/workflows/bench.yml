name: Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: GHC vs ripgrep (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Outside target/, which rust-cache prunes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bench/ghc
          key: bench-ghc-${{ runner.os }}-${{ hashFiles('crates/bench/queries/ghc.json') }}
      - name: Benchmark
        run: scripts/bench.sh --bench-dir "$RUNNER_TEMP/bench"
      - name: Job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bench/results-ghc.md" ]; then
            cat "$RUNNER_TEMP/bench/results-ghc.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bench-ghc-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/bench/results-ghc.md
            ${{ runner.temp }}/bench/trace-ghc.jsonl
