[package]
name = "docfm"
description = "Byte-alphabet FM-index for document search, stored as one zero-copy blob"
readme = "README.md"
keywords = ["fm-index", "bwt", "suffix-array", "full-text", "search"]
categories = ["data-structures", "text-processing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
docfm-bits = { path = "../docfm-bits", version = "0.1.0" }
msbwt = { path = "../msbwt", version = "0.1.0" }
rayon = "1"
thiserror = "2"
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
dicetest = "0.3"
